<!-- @dsCard group="06 Icons" viewport="700x300" name="Icon containers" subtitle="Four treatments × two shapes, across the color families" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>*{box-sizing:border-box}html,body{margin:0}body{width:700px;font-family:var(--font-sans);color:var(--ink);background:#fff;padding:16px 20px}.grid{display:grid;grid-template-columns:repeat(2,auto);gap:14px 16px;justify-content:start}.tset{display:flex;flex-direction:column;gap:8px}.pane{background:linear-gradient(135deg,var(--lavender-100),var(--xray-100));border-radius:14px;padding:10px 12px;display:inline-flex;flex-direction:column;gap:9px}.lab{font:500 9px/1 var(--font-mono);color:var(--neutral-500)}</style></head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script>window.__resources={};['stethoscope','heart','calendar-blank','chat-circle','microphone','pulse','first-aid-kit','gear'].forEach(n=>{window.__resources['icon_'+n]='../../assets/icons/'+n+'.svg';});</script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel" data-presets="react">
const { Icon } = window.FreedDesignSystem_e5ae95;
const GLYPHS = ['stethoscope','microphone','pulse','calendar-blank','heart','gear'];
const ROWS = [
  ['flat-white','Flat · white glyph',['primary','green','saline','pepto','xray','error']],
  ['flat-tonal','Flat · tonal glyph',['primary','green','saline','pepto','xray','neutral']],
  ['glass-white','Glass · white glyph',['primary','green','saline','pepto','xray','error']],
  ['glass-tonal','Glass · tonal glyph',['primary','green','saline','pepto','xray','neutral']],
];
function Demo() {
  return <div className="grid">
    {ROWS.map(([t,label,fams]) => (
      <div key={t} className="tset">
        <div className="lab">{label}</div>
        <div className="pane">
          <div style={{display:'flex',gap:8}}>{fams.map((c,i)=><Icon key={c} name={GLYPHS[i]} treatment={t} shape="tile" color={c} size={34}/>)}</div>
          <div style={{display:'flex',gap:8}}>{fams.map((c,i)=><Icon key={c} name={GLYPHS[i]} treatment={t} shape="circle" color={c} size={34}/>)}</div>
        </div>
      </div>
    ))}
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
</body></html>
