<!-- @dsCard group="05 Cards" viewport="700x375" name="Card surfaces" subtitle="Glass, bubble, glow, and petri dish" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>*{box-sizing:border-box}html,body{margin:0}body{width:700px;font-family:var(--font-sans);color:var(--ink);background:#fff;padding:16px 20px}.row{display:grid;grid-template-columns:repeat(2,1fr);gap:16px 18px}.h{font:600 10px/1 var(--font-sans);letter-spacing:.07em;text-transform:uppercase;color:var(--neutral-500);margin:0 0 8px}.on{background:linear-gradient(135deg,var(--lavender-400),var(--xray-400) 55%,var(--pepto-300));border-radius:16px;padding:14px}.shot{background:#fff;border-radius:10px;padding:12px 14px;box-shadow:var(--elevation-small)}.shot-t{font:600 12px/1.3 var(--font-sans);color:var(--ink);margin-bottom:8px}.shot-l{height:7px;border-radius:4px;background:var(--neutral-100);margin-bottom:6px}.shot-l.short{width:60%;margin-bottom:0}</style></head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel" data-presets="react">
const { Card } = window.FreedDesignSystem_e5ae95;
const T = 'Specialty templates', B = 'Match your workflow and visit types.';
function Demo() {
  return <div>
    <div className="row">
      <div>
        <p className="h">Glass · neutral, on a backdrop</p>
        <div className="on"><Card effect="glass" color="neutral" elevation="medium" title={T} body={B} /></div>
      </div>
      <div>
        <p className="h">Petri dish · holds product imagery</p>
        <Card effect="petri"><div className="shot"><div className="shot-t">Chief complaint</div><div className="shot-l"></div><div className="shot-l short"></div></div></Card>
      </div>
      <div>
        <p className="h">Glow</p>
        <Card effect="glow" title={T} body={B} style={{width:'100%'}} />
      </div>
      <div>
        <p className="h">Bubble</p>
        <Card effect="bubble" title={T} body={B} />
      </div>
    </div>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
</body></html>
