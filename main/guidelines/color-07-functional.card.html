<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}html,body{margin:0}body{font-family:var(--font-family-body);color:var(--text-color-primary);background:var(--background-primary);padding:16px 20px;-webkit-font-smoothing:antialiased}.mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}.ramp{display:flex;border-radius:var(--border-radius-small);overflow:hidden;box-shadow:var(--effect-elevation-tiny)}.step{flex:1;height:56px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding-bottom:7px;gap:2px}.step b{font:600 10px/1 var(--font-family-body)}.step span{font:400 9px/1 ui-monospace,Menlo,monospace;opacity:.8}.star{outline:2px solid var(--text-color-primary);outline-offset:-4px}.lab{font:600 11px/1 var(--font-family-body);letter-spacing:.06em;text-transform:uppercase;color:var(--text-color-secondary);margin:10px 0 6px}</style></head><body><p class="lab">Yellow · caution</p><div class="ramp"><div class="step" style="background:var(--yellow-50)"><b style="color:#212121">50</b><span style="color:#212121">FFFDEA</span></div><div class="step" style="background:var(--yellow-200)"><b style="color:#212121">200</b><span style="color:#212121">FFF9AD</span></div><div class="step star" style="background:var(--yellow-400)"><b style="color:#212121">400*</b><span style="color:#212121">F6E600</span></div><div class="step" style="background:var(--yellow-800)"><b style="color:#ffffff">800</b><span style="color:#ffffff">7D7500</span></div><div class="step" style="background:var(--yellow-950)"><b style="color:#ffffff">950</b><span style="color:#ffffff">413D05</span></div></div><p class="lab">Red · error</p><div class="ramp"><div class="step" style="background:var(--red-50)"><b style="color:#212121">50</b><span style="color:#212121">FFECEA</span></div><div class="step" style="background:var(--red-200)"><b style="color:#212121">200</b><span style="color:#212121">FFB7AD</span></div><div class="step star" style="background:var(--red-400)"><b style="color:#ffffff">400*</b><span style="color:#ffffff">E01900</span></div><div class="step" style="background:var(--red-800)"><b style="color:#ffffff">800</b><span style="color:#ffffff">9E2414</span></div><div class="step" style="background:var(--red-950)"><b style="color:#ffffff">950</b><span style="color:#ffffff">280501</span></div></div><p class="lab">Orange · warning</p><div class="ramp"><div class="step" style="background:var(--orange-50)"><b style="color:#212121">50</b><span style="color:#212121">FFF2EA</span></div><div class="step" style="background:var(--orange-200)"><b style="color:#212121">200</b><span style="color:#212121">FFCCAD</span></div><div class="step star" style="background:var(--orange-400)"><b style="color:#212121">400*</b><span style="color:#212121">FF7A14</span></div><div class="step" style="background:var(--orange-800)"><b style="color:#ffffff">800</b><span style="color:#ffffff">BF3C00</span></div><div class="step" style="background:var(--orange-950)"><b style="color:#ffffff">950</b><span style="color:#ffffff">722400</span></div></div></body></html>
