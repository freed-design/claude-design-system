<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}html,body{margin:0}body{font-family:var(--font-family-body);color:var(--text-color-primary);background:var(--background-primary);padding:16px 20px;-webkit-font-smoothing:antialiased}.mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}.row{display:flex;align-items:flex-end;gap:8px;flex-wrap:wrap}.c{display:flex;flex-direction:column;align-items:center;gap:6px}.b{background:var(--purple-400);border-radius:2px}.l{font-size:9px;color:var(--text-color-secondary);text-align:center}</style></head><body><div class="row"><div class="c"><div class="b" style="width:min(var(--spacing-tiny),96px);height:var(--spacing-tiny);max-height:192px"></div><div class="l mono">tiny<br>2</div></div><div class="c"><div class="b" style="width:min(var(--spacing-xxxsmall),96px);height:var(--spacing-xxxsmall);max-height:192px"></div><div class="l mono">xxxsmall<br>4</div></div><div class="c"><div class="b" style="width:min(var(--spacing-xxsmall),96px);height:var(--spacing-xxsmall);max-height:192px"></div><div class="l mono">xxsmall<br>8</div></div><div class="c"><div class="b" style="width:min(var(--spacing-xsmaller),96px);height:var(--spacing-xsmaller);max-height:192px"></div><div class="l mono">xsmaller<br>12</div></div><div class="c"><div class="b" style="width:min(var(--spacing-smaller),96px);height:var(--spacing-smaller);max-height:192px"></div><div class="l mono">smaller<br>16</div></div><div class="c"><div class="b" style="width:min(var(--spacing-small),96px);height:var(--spacing-small);max-height:192px"></div><div class="l mono">small<br>20</div></div><div class="c"><div class="b" style="width:min(var(--spacing-medium),96px);height:var(--spacing-medium);max-height:192px"></div><div class="l mono">medium<br>32</div></div><div class="c"><div class="b" style="width:min(var(--spacing-large),96px);height:var(--spacing-large);max-height:192px"></div><div class="l mono">large<br>48</div></div><div class="c"><div class="b" style="width:min(var(--spacing-xlarge),96px);height:var(--spacing-xlarge);max-height:192px"></div><div class="l mono">xlarge<br>64</div></div><div class="c"><div class="b" style="width:min(var(--spacing-xxlarge),96px);height:var(--spacing-xxlarge);max-height:192px"></div><div class="l mono">xxlarge<br>80</div></div><div class="c"><div class="b" style="width:min(var(--spacing-huge),96px);height:var(--spacing-huge);max-height:192px"></div><div class="l mono">huge<br>96</div></div><div class="c"><div class="b" style="width:min(var(--spacing-xhuge),96px);height:var(--spacing-xhuge);max-height:192px"></div><div class="l mono">xhuge<br>128</div></div><div class="c"><div class="b" style="width:min(var(--spacing-xxhuge),96px);height:var(--spacing-xxhuge);max-height:192px"></div><div class="l mono">xxhuge<br>192</div></div></div></body></html>
