<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}html,body{margin:0}body{font-family:var(--font-sans);color:var(--ink);background:#fff;padding:16px 20px;-webkit-font-smoothing:antialiased}.row{display:flex;align-items:flex-end;gap:10px}.c{display:flex;flex-direction:column;align-items:center;gap:6px}.b{background:var(--lavender-300);border-radius:4px}.l{font:500 9px var(--font-mono);color:var(--neutral-500)}</style></head><body><div class="row"><div class="c"><div class="b" style="width:4px;height:4px"></div><div class="l">1<br>4</div></div><div class="c"><div class="b" style="width:8px;height:8px"></div><div class="l">2<br>8</div></div><div class="c"><div class="b" style="width:12px;height:12px"></div><div class="l">3<br>12</div></div><div class="c"><div class="b" style="width:16px;height:16px"></div><div class="l">4<br>16</div></div><div class="c"><div class="b" style="width:20px;height:20px"></div><div class="l">5<br>20</div></div><div class="c"><div class="b" style="width:24px;height:24px"></div><div class="l">6<br>24</div></div><div class="c"><div class="b" style="width:32px;height:32px"></div><div class="l">8<br>32</div></div><div class="c"><div class="b" style="width:40px;height:40px"></div><div class="l">10<br>40</div></div><div class="c"><div class="b" style="width:48px;height:48px"></div><div class="l">12<br>48</div></div><div class="c"><div class="b" style="width:64px;height:64px"></div><div class="l">16<br>64</div></div><div class="c"><div class="b" style="width:80px;height:80px"></div><div class="l">20<br>80</div></div><div class="c"><div class="b" style="width:96px;height:96px"></div><div class="l">24<br>96</div></div></div></body></html>
