<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}html,body{margin:0}body{font-family:var(--font-family-body);color:var(--text-color-primary);background:var(--background-primary);padding:16px 20px;-webkit-font-smoothing:antialiased}.mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}.ramp{display:flex;border-radius:var(--border-radius-small);overflow:hidden;box-shadow:var(--effect-elevation-tiny)}.step{flex:1;height:82px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding-bottom:7px;gap:2px}.step b{font:600 10px/1 var(--font-family-body)}.step span{font:400 9px/1 ui-monospace,Menlo,monospace;opacity:.8}.star{outline:2px solid var(--text-color-primary);outline-offset:-4px}</style></head><body><div class="ramp"><div class="step" style="background:var(--green-50)"><b style="color:#212121">50</b><span style="color:#212121">F0FEF2</span></div><div class="step" style="background:var(--green-100)"><b style="color:#212121">100</b><span style="color:#212121">E2FDE6</span></div><div class="step" style="background:var(--green-200)"><b style="color:#212121">200</b><span style="color:#212121">C6FBCD</span></div><div class="step" style="background:var(--green-300)"><b style="color:#212121">300</b><span style="color:#212121">A7F1B1</span></div><div class="step" style="background:var(--green-400)"><b style="color:#212121">400</b><span style="color:#212121">83EC91</span></div><div class="step star" style="background:var(--green-500)"><b style="color:#212121">500*</b><span style="color:#212121">62E774</span></div><div class="step" style="background:var(--green-600)"><b style="color:#212121">600</b><span style="color:#212121">34CB48</span></div><div class="step" style="background:var(--green-700)"><b style="color:#212121">700</b><span style="color:#212121">23A935</span></div><div class="step" style="background:var(--green-800)"><b style="color:#ffffff">800</b><span style="color:#ffffff">117E21</span></div><div class="step" style="background:var(--green-900)"><b style="color:#ffffff">900</b><span style="color:#ffffff">12591E</span></div><div class="step" style="background:var(--green-950)"><b style="color:#ffffff">950</b><span style="color:#ffffff">004709</span></div></div></body></html>
