<!-- @dsCard group="08 Layout" viewport="700x160" name="Corner radii" subtitle="xsmall 4 · small 8 · primary 16 · large 32 · full" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}html,body{margin:0}body{font-family:var(--font-family-body);color:var(--text-color-primary);background:var(--background-primary);padding:16px 20px;-webkit-font-smoothing:antialiased}.mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}.row{display:flex;gap:16px}.c{display:flex;flex-direction:column;align-items:center;gap:7px}.b{width:100px;height:72px;background:var(--purple-100);border:1px solid var(--purple-300)}.l{font-size:10px;color:var(--text-color-secondary);text-align:center}</style></head><body><div class="row"><div class="c"><div class="b" style="border-radius:var(--border-radius-xsmall)"></div><div class="l mono">--border-radius-xsmall<br>4px</div></div><div class="c"><div class="b" style="border-radius:var(--border-radius-small)"></div><div class="l mono">--border-radius-small<br>8px</div></div><div class="c"><div class="b" style="border-radius:var(--border-radius-primary)"></div><div class="l mono">--border-radius-primary<br>16px</div></div><div class="c"><div class="b" style="border-radius:var(--border-radius-large)"></div><div class="l mono">--border-radius-large<br>32px</div></div><div class="c"><div class="b" style="border-radius:var(--border-radius-full)"></div><div class="l mono">--border-radius-full<br>999px</div></div></div></body></html>
