<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}html,body{margin:0}body{font-family:var(--font-sans);color:var(--ink);background:#fff;padding:16px 20px;-webkit-font-smoothing:antialiased}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.sw{display:flex;align-items:center;gap:8px}.chip{width:26px;height:26px;border-radius:8px;border:1px solid var(--neutral-200);flex-shrink:0}.n{font:500 11px/1.3 var(--font-mono);color:var(--ink)}.v{font:400 10px/1.3 var(--font-sans);color:var(--neutral-500)}</style></head><body><div class="grid"><div class="sw"><div class="chip" style="background:var(--bg)"></div><div><div class="n">--bg</div><div class="v">#ffffff</div></div></div><div class="sw"><div class="chip" style="background:var(--bg-subtle)"></div><div><div class="n">--bg-subtle</div><div class="v">neutral-50</div></div></div><div class="sw"><div class="chip" style="background:var(--bg-lavender)"></div><div><div class="n">--bg-lavender</div><div class="v">lavender-100</div></div></div><div class="sw"><div class="chip" style="background:var(--primary)"></div><div><div class="n">--primary</div><div class="v">lavender-600</div></div></div><div class="sw"><div class="chip" style="background:var(--primary-hover)"></div><div><div class="n">--primary-hover</div><div class="v">lavender-500</div></div></div><div class="sw"><div class="chip" style="background:var(--primary-press)"></div><div><div class="n">--primary-press</div><div class="v">lavender-700</div></div></div><div class="sw"><div class="chip" style="background:var(--primary-tint)"></div><div><div class="n">--primary-tint</div><div class="v">lavender-100</div></div></div><div class="sw"><div class="chip" style="background:var(--success)"></div><div><div class="n">--success</div><div class="v">green-600</div></div></div><div class="sw"><div class="chip" style="background:var(--info)"></div><div><div class="n">--info</div><div class="v">saline-600</div></div></div><div class="sw"><div class="chip" style="background:var(--warning)"></div><div><div class="n">--warning</div><div class="v">yellow-500</div></div></div><div class="sw"><div class="chip" style="background:var(--danger)"></div><div><div class="n">--danger</div><div class="v">red-500</div></div></div><div class="sw"><div class="chip" style="background:var(--border)"></div><div><div class="n">--border</div><div class="v">neutral-200</div></div></div></div></body></html>
