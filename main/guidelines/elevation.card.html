<!-- @dsCard group="08 Layout" viewport="700x180" name="Elevation and card effects" subtitle="Figma effect styles — one elevation layer per surface, never stacked" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}html,body{margin:0}body{font-family:var(--font-family-body);color:var(--text-color-primary);background:var(--background-primary);padding:16px 20px;-webkit-font-smoothing:antialiased}.mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}.row{display:flex;gap:22px;padding:10px 6px 16px}.c{display:flex;flex-direction:column;align-items:center;gap:10px}.b{width:100px;height:72px;border-radius:var(--border-radius-primary);background:var(--background-primary)}.l{font-size:10px;color:var(--text-color-secondary);text-align:center}</style></head><body><div class="row"><div class="c"><div class="b" style="box-shadow:var(--effect-elevation-tiny)"></div><div class="l mono">--effect-elevation-tiny</div></div><div class="c"><div class="b" style="box-shadow:var(--effect-elevation-small)"></div><div class="l mono">--effect-elevation-small</div></div><div class="c"><div class="b" style="box-shadow:var(--effect-elevation-primary)"></div><div class="l mono">--effect-elevation-primary</div></div><div class="c"><div class="b" style="box-shadow:var(--effect-bubble-card-elevation-small)"></div><div class="l mono">--effect-bubble-card-elevation-small</div></div><div class="c"><div class="b" style="box-shadow:var(--effect-glow-card-primary)"></div><div class="l mono">--effect-glow-card-primary</div></div></div></body></html>
