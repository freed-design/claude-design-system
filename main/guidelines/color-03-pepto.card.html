<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}html,body{margin:0}body{font-family:var(--font-family-body);color:var(--text-color-primary);background:var(--background-primary);padding:16px 20px;-webkit-font-smoothing:antialiased}.mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}.ramp{display:flex;border-radius:var(--border-radius-small);overflow:hidden;box-shadow:var(--effect-elevation-tiny)}.step{flex:1;height:82px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding-bottom:7px;gap:2px}.step b{font:600 10px/1 var(--font-family-body)}.step span{font:400 9px/1 ui-monospace,Menlo,monospace;opacity:.8}.star{outline:2px solid var(--text-color-primary);outline-offset:-4px}</style></head><body><div class="ramp"><div class="step" style="background:var(--pepto-50)"><b style="color:#212121">50</b><span style="color:#212121">FFF0F7</span></div><div class="step" style="background:var(--pepto-100)"><b style="color:#212121">100</b><span style="color:#212121">FFE0F0</span></div><div class="step" style="background:var(--pepto-200)"><b style="color:#212121">200</b><span style="color:#212121">FFC7E4</span></div><div class="step" style="background:var(--pepto-300)"><b style="color:#212121">300</b><span style="color:#212121">FFA3D1</span></div><div class="step star" style="background:var(--pepto-400)"><b style="color:#212121">400*</b><span style="color:#212121">FF7FBE</span></div><div class="step" style="background:var(--pepto-500)"><b style="color:#212121">500</b><span style="color:#212121">F95DAA</span></div><div class="step" style="background:var(--pepto-600)"><b style="color:#212121">600</b><span style="color:#212121">F13B95</span></div><div class="step" style="background:var(--pepto-700)"><b style="color:#ffffff">700</b><span style="color:#ffffff">E02482</span></div><div class="step" style="background:var(--pepto-800)"><b style="color:#ffffff">800</b><span style="color:#ffffff">B11B66</span></div><div class="step" style="background:var(--pepto-900)"><b style="color:#ffffff">900</b><span style="color:#ffffff">8D275A</span></div><div class="step" style="background:var(--pepto-950)"><b style="color:#ffffff">950</b><span style="color:#ffffff">68334D</span></div></div></body></html>
