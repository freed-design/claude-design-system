<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}html,body{margin:0}body{font-family:var(--font-sans);color:var(--ink);background:#fff;padding:16px 20px;-webkit-font-smoothing:antialiased}.ramp{display:flex;border-radius:12px;overflow:hidden;box-shadow:var(--elevation-small)}.step{flex:1;height:82px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding-bottom:7px;gap:2px}.step b{font:600 10px/1 var(--font-sans)}.step span{font:400 9px/1 var(--font-mono);opacity:.75}</style></head><body><div class="ramp"><div class="step" style="background:#fff0f7"><b style="color:#212121">50</b><span style="color:#212121">FFF0F7</span></div><div class="step" style="background:#ffe0f0"><b style="color:#212121">100</b><span style="color:#212121">FFE0F0</span></div><div class="step" style="background:#ffc7e4"><b style="color:#212121">200</b><span style="color:#212121">FFC7E4</span></div><div class="step" style="background:#ffa3d1"><b style="color:#212121">300</b><span style="color:#212121">FFA3D1</span></div><div class="step" style="background:#ff7fbe"><b style="color:#212121">400</b><span style="color:#212121">FF7FBE</span></div><div class="step" style="background:#f95daa"><b style="color:#fff">500</b><span style="color:#fff">F95DAA</span></div><div class="step" style="background:#f13b95"><b style="color:#fff">600</b><span style="color:#fff">F13B95</span></div><div class="step" style="background:#e02482"><b style="color:#fff">700</b><span style="color:#fff">E02482</span></div><div class="step" style="background:#b11b66"><b style="color:#fff">800</b><span style="color:#fff">B11B66</span></div><div class="step" style="background:#8d275a"><b style="color:#fff">900</b><span style="color:#fff">8D275A</span></div><div class="step" style="background:#68334d"><b style="color:#fff">950</b><span style="color:#fff">68334D</span></div></div></body></html>
