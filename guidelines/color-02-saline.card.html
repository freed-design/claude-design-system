<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}html,body{margin:0}body{font-family:var(--font-sans);color:var(--ink);background:#fff;padding:16px 20px;-webkit-font-smoothing:antialiased}.ramp{display:flex;border-radius:12px;overflow:hidden;box-shadow:var(--elevation-small)}.step{flex:1;height:82px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding-bottom:7px;gap:2px}.step b{font:600 10px/1 var(--font-sans)}.step span{font:400 9px/1 var(--font-mono);opacity:.75}</style></head><body><div class="ramp"><div class="step" style="background:#ebf2fe"><b style="color:#212121">50</b><span style="color:#212121">EBF2FE</span></div><div class="step" style="background:#dce8fe"><b style="color:#212121">100</b><span style="color:#212121">DCE8FE</span></div><div class="step" style="background:#ceddfd"><b style="color:#212121">200</b><span style="color:#212121">CEDDFD</span></div><div class="step" style="background:#b9cdfb"><b style="color:#212121">300</b><span style="color:#212121">B9CDFB</span></div><div class="step" style="background:#9fb9fa"><b style="color:#212121">400</b><span style="color:#212121">9FB9FA</span></div><div class="step" style="background:#8ba8fe"><b style="color:#212121">500</b><span style="color:#212121">8BA8FE</span></div><div class="step" style="background:#557bf7"><b style="color:#fff">600</b><span style="color:#fff">557BF7</span></div><div class="step" style="background:#2c51d8"><b style="color:#fff">700</b><span style="color:#fff">2C51D8</span></div><div class="step" style="background:#0e30a6"><b style="color:#fff">800</b><span style="color:#fff">0E30A6</span></div><div class="step" style="background:#041b6c"><b style="color:#fff">900</b><span style="color:#fff">041B6C</span></div><div class="step" style="background:#041144"><b style="color:#fff">950</b><span style="color:#fff">041144</span></div></div></body></html>
