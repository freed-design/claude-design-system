<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}html,body{margin:0}body{font-family:var(--font-sans);color:var(--ink);background:#fff;padding:16px 20px;-webkit-font-smoothing:antialiased}.g{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}.k{font:600 10px/1 var(--font-sans);letter-spacing:.08em;text-transform:uppercase;color:var(--lavender-600);margin:0 0 8px}.sp{font-size:34px;line-height:1.1;color:var(--ink)}.m{font:400 10px/1.5 var(--font-mono);color:var(--neutral-500);margin-top:8px}</style></head><body><div class="g"><div><p class="k">Display</p><div class="sp" style="font-family:var(--font-display)">Aa Bb Gg</div><div class="m">--font-display<br>Nunito 400/500/600</div></div><div><p class="k">Sans / UI</p><div class="sp" style="font-family:var(--font-sans)">Aa Bb Gg</div><div class="m">--font-sans<br>Inter 300–500 + italic</div></div><div><p class="k">Mono</p><div class="sp" style="font-family:var(--font-mono)">Aa Bb Gg</div><div class="m">--font-mono<br>system ui-monospace</div></div></div></body></html>
