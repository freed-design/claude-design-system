<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}html,body{margin:0}body{font-family:var(--font-sans);color:var(--ink);background:#fff;padding:16px 20px;-webkit-font-smoothing:antialiased}.ramp{display:flex;border-radius:12px;overflow:hidden;box-shadow:var(--elevation-small)}.step{flex:1;height:82px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding-bottom:7px;gap:2px}.step b{font:600 10px/1 var(--font-sans)}.step span{font:400 9px/1 var(--font-mono);opacity:.75}</style></head><body><div class="ramp"><div class="step" style="background:#ffffff"><b style="color:#212121">0</b><span style="color:#212121">FFFFFF</span></div><div class="step" style="background:#f7f7f7"><b style="color:#212121">50</b><span style="color:#212121">F7F7F7</span></div><div class="step" style="background:#e8e8e8"><b style="color:#212121">100</b><span style="color:#212121">E8E8E8</span></div><div class="step" style="background:#d9d9d9"><b style="color:#212121">200</b><span style="color:#212121">D9D9D9</span></div><div class="step" style="background:#c9c9c9"><b style="color:#212121">300</b><span style="color:#212121">C9C9C9</span></div><div class="step" style="background:#b3b3b3"><b style="color:#212121">400</b><span style="color:#212121">B3B3B3</span></div><div class="step" style="background:#999999"><b style="color:#212121">500</b><span style="color:#212121">999999</span></div><div class="step" style="background:#737373"><b style="color:#fff">600</b><span style="color:#fff">737373</span></div><div class="step" style="background:#4c4c4c"><b style="color:#fff">700</b><span style="color:#fff">4C4C4C</span></div><div class="step" style="background:#212121"><b style="color:#fff">800</b><span style="color:#fff">212121</span></div><div class="step" style="background:#000000"><b style="color:#fff">950</b><span style="color:#fff">000000</span></div></div></body></html>
