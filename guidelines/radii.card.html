<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}html,body{margin:0}body{font-family:var(--font-sans);color:var(--ink);background:#fff;padding:16px 20px;-webkit-font-smoothing:antialiased}.row{display:flex;gap:14px;align-items:flex-start}.c{display:flex;flex-direction:column;align-items:center;gap:7px}.b{width:92px;height:72px;background:var(--lavender-100);border:1px solid var(--lavender-300)}.l{font:500 10px var(--font-mono);color:var(--neutral-600)}</style></head><body><div class="row"><div class="c"><div class="b" style="border-radius:6px"></div><div class="l">--radius-xs<br>6px</div></div><div class="c"><div class="b" style="border-radius:8px"></div><div class="l">--radius-sm<br>8px</div></div><div class="c"><div class="b" style="border-radius:14px"></div><div class="l">--radius-md<br>14px</div></div><div class="c"><div class="b" style="border-radius:20px"></div><div class="l">--radius-lg<br>20px</div></div><div class="c"><div class="b" style="border-radius:30px"></div><div class="l">--radius-xl<br>30px</div></div><div class="c"><div class="b" style="border-radius:999px"></div><div class="l">--radius-pill<br>999px</div></div></div></body></html>
