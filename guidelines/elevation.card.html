<!-- @dsCard group="08 Spacing" viewport="700x170" name="Elevation" subtitle="One layer per surface — never stack shadows" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}html,body{margin:0}body{font-family:var(--font-sans);color:var(--ink);background:#fff;padding:16px 20px;-webkit-font-smoothing:antialiased}.row{display:flex;gap:22px;padding:8px 4px 16px}.c{flex:1;display:flex;flex-direction:column;align-items:center;gap:9px}.b{width:100%;height:74px;background:#fff;border-radius:var(--radius-md)}.l{font:500 10px var(--font-mono);color:var(--neutral-600)}</style></head><body><div class="row"><div class="c"><div class="b" style="box-shadow:var(--elevation-small)"></div><div class="l">--elevation-small</div></div><div class="c"><div class="b" style="box-shadow:var(--elevation-medium)"></div><div class="l">--elevation-medium</div></div><div class="c"><div class="b" style="box-shadow:var(--elevation-large)"></div><div class="l">--elevation-large</div></div></div></body></html>
